# Project-scoped configuration. All capabilities remain unverified until native probes.
default_permissions = "factory-coordinator"
approval_policy = "never"
web_search = "disabled"

[agents]
max_concurrent_threads_per_session = 1

[apps._default]
enabled = false
destructive_enabled = false
open_world_enabled = false
# GitHub app id/tool keys require native discovery; no guessed allowlist.

[computer_use]
default_app_access = "deny"

[mcp_servers.node_repl]
enabled = false

[mcp_servers.stitch]
enabled = false

[mcp_servers.codebase-memory-mcp]
enabled_tools = ["search_graph", "trace_path", "get_code_snippet", "query_graph", "get_architecture", "list_projects", "index_repository"]
# This local MCP reads outside the command sandbox. It is not filesystem enforcement.

[permissions.factory-coordinator]
description = "Read-only coordinator; no worker activation."
extends = ":read-only"

[permissions.factory-coordinator.filesystem]
# User-approved Windows A: other local files remain readable unless explicitly denied.
":root" = "read"
":minimal" = "read"
# Native startup snapshots matching files; deeper/new files require a new scope check.
glob_scan_max_depth = 6
"C:/Users/tokso/.codex" = "deny"
"C:/Users/tokso/.ssh" = "deny"
"C:/Users/tokso/.aws" = "deny"
"C:/Users/tokso/.azure" = "deny"
"C:/Users/tokso/.kube" = "deny"
"C:/Users/tokso/.config/gcloud" = "deny"
"C:/Users/tokso/.git-credentials" = "deny"
"C:/Users/tokso/.netrc" = "deny"
"C:/Users/tokso/_netrc" = "deny"
"C:/Users/tokso/AppData/Roaming/Microsoft/UserSecrets" = "deny"
"C:/Users/tokso/Documents" = "deny"
"C:/Users/tokso/Desktop" = "deny"
"C:/Users/tokso/Downloads" = "deny"
"C:/Users/tokso/Pictures" = "deny"
"C:/Users/tokso/Music" = "deny"
"C:/Users/tokso/Videos" = "deny"
"C:/Users/tokso/OneDrive" = "deny"

# Registered source roots receive read denials, never workspace write grants.
[permissions.factory-coordinator.filesystem."C:/Users/tokso/source/HabitAI/life_coach_ai"]
"." = "read"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"

[permissions.factory-coordinator.filesystem."C:/Users/tokso/source/repos/HabitAI"]
"." = "read"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"

[permissions.factory-coordinator.filesystem."C:/Users/tokso/source/repos/HabitAI-LandingPage"]
"." = "read"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"

[permissions.factory-coordinator.filesystem."C:/Users/tokso/source/repos/WhisperRoom"]
"." = "read"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"

[permissions.factory-coordinator.filesystem."C:/Users/tokso/source/repos/whisper_room"]
"." = "read"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"

[permissions.factory-coordinator.filesystem.":workspace_roots"]
"." = "read"
"verification/runs" = "write"
".env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"
"work/permission-fixture/secrets" = "deny"

[permissions.factory-coordinator.network]
enabled = false

[permissions.factory-reviewer]
description = "Independent reviewer; evidence read-only too."
extends = "factory-coordinator"

[permissions.factory-reviewer.filesystem.":workspace_roots"]
"verification/runs" = "read"

[permissions.factory-worker-fixture]
description = "Disposable fixture only, one approved application file."
extends = "factory-reviewer"

[permissions.factory-worker-fixture.filesystem]
":tmpdir" = "read"

[permissions.factory-worker-fixture.filesystem.":workspace_roots"]
"." = "read"
"work/permission-fixture/app/allowed.txt" = "write"
"verification/runs/native-controls" = "write"

[permissions.factory-worker-fixture.network]
enabled = false
